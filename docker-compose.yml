services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ieum_exp}
      POSTGRES_USER: ${POSTGRES_USER:-ieum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      - ieum_pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  manager:
    build: .
    restart: unless-stopped
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      IEUM_MANAGER_HOST: 0.0.0.0
      IEUM_MANAGER_ADMIN_TOKEN: ${IEUM_MANAGER_ADMIN_TOKEN:?IEUM_MANAGER_ADMIN_TOKEN을 .env에 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?AAH와 동일한 JWT_SECRET을 .env에 설정하세요}
      IEUM_MANAGER_TRUST_PROXY: ${IEUM_MANAGER_TRUST_PROXY:-0}
      IEUM_VOUCHER_PRIVATE_KEY: ${IEUM_VOUCHER_PRIVATE_KEY:?상품권 전용 지갑 개인키를 설정하세요}
      IEUM_VOUCHER_PUBLIC_URL: ${IEUM_VOUCHER_PUBLIC_URL:-https://iem.aah.name}
      IEUM_VOUCHER_RPC_URL: ${IEUM_VOUCHER_RPC_URL:?상품권 지급 RPC를 설정하세요}
      IEUM_VOUCHER_EXPLORER_URL: ${IEUM_VOUCHER_EXPLORER_URL:-https://iem.aah.name/tx/}
      IEUM_VOUCHER_CODE_PEPPER: ${IEUM_VOUCHER_CODE_PEPPER:?32자 이상의 무작위 비밀값을 설정하세요}
      IEUM_VOUCHER_ARCHIVE_KEY: ${IEUM_VOUCHER_ARCHIVE_KEY:?상품권 보기 재출력용 32자 이상의 별도 암호화 키를 설정하세요}
      IEUM_RECOVERY_CONTROL_DIR: /app/control
      IEUM_RECOVERY_CONTROL_TOKEN: ${IEUM_RECOVERY_CONTROL_TOKEN:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ieum}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ieum_exp}
    volumes:
      - ./config.json:/app/config.json:ro
      - ieum_manager_data:/app/data
      - ieum_manager_logs:/app/logs
      - ${IEUM_RECOVERY_CONTROL_HOST_DIR:-./control}:/app/control
    ports: 
      - "8787:8787"
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [backend]
  indexer:
    build: .
    command: ["node","indexer.js"]
    restart: unless-stopped
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ieum}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ieum_exp}
      INDEX_INTERVAL_MS: ${INDEX_INTERVAL_MS:-3000}
    volumes:
      - ./config.json:/app/config.json:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [backend]
networks: {backend: {}}
volumes: {ieum_pg_data: {}, ieum_manager_data: {}, ieum_manager_logs: {}}
