name: IEUM Manager CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ieum-manager-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          IEUM_MANAGER_ADMIN_TOKEN: ci-only-placeholder-32-characters-minimum
          JWT_SECRET: ci-only-jwt-secret-not-for-production
          IEUM_VOUCHER_PRIVATE_KEY: ci-only-private-key-placeholder
          IEUM_VOUCHER_RPC_URL: http://127.0.0.1:8989
          IEUM_VOUCHER_CODE_PEPPER: ci-only-voucher-pepper-32-characters-minimum
        run: docker compose config
      - name: Build application images without starting PostgreSQL
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          IEUM_MANAGER_ADMIN_TOKEN: ci-only-placeholder-32-characters-minimum
          JWT_SECRET: ci-only-jwt-secret-not-for-production
        run: docker compose build manager indexer
