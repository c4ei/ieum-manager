<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IEUM 체험 명함 캠페인</title><link rel="stylesheet" href="/voucher.css?v=10013"><link rel="stylesheet" href="/trial-campaigns.css?v=10013"></head><body><main><header><div><a href="/admin/dashboard">← 전체 관리자</a><h1>체험 명함 캠페인</h1><p>소액 체험 지급의 예산·기간·중복·이상 요청을 관리합니다.</p></div><a href="/admin/vouchers">상품권 관리</a></header><section class="card"><label>비상 관리자 토큰<input id="admin-token" type="password"><button id="connect">인증</button></label></section><section class="card"><h2>새 캠페인</h2><form id="create" class="grid"><label>캠페인 이름<input id="name" value="IEUM 첫 체험 명함 2026-08" required></label><label>1회 지급액<input id="reward" value="0.001" required></label><label>최초 예산<input id="budget" value="10" required></label><label>시작<input id="starts" type="datetime-local" required></label><label>종료<input id="ends" type="datetime-local" required></label><label>IP 하루 한도<input id="ip-limit" type="number" value="1" min="1"></label><label>기기 하루 한도<input id="device-limit" type="number" value="1" min="1"></label><label>5분 대량요청 한도<input id="burst-limit" type="number" value="3" min="1"></label><label>최소 대기(초)<input id="wait" type="number" value="15" min="0"></label><label><input id="captcha" type="checkbox" checked> CAPTCHA 필수</label><button>일시정지 상태로 만들기</button></form></section><section class="card"><div class="head"><h2>캠페인 현황</h2><button id="refresh">새로고침</button></div><div id="status"></div><div id="campaigns"></div></section></main><script type="module" src="/trial-campaigns-admin.js?v=10013"></script></body></html>
