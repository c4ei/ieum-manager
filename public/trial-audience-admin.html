<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IEUM 체험 고객·설문</title><link rel="stylesheet" href="/trial-campaigns.css?v=10018"><link rel="stylesheet" href="/admin-nav.css?v=10018"></head><body><main><header><div><h1>체험 고객·설문</h1><p>이메일 인증, 국가, IP, 마케팅 동의와 관심 태그를 관리합니다.</p></div></header><section class="card"><label>비상 관리자 토큰<input id="admin-token" type="password"><button id="connect">인증</button></label></section><section class="card"><h2>대상 필터</h2><form id="filters" class="grid"><label>검색<input id="q" placeholder="이메일 또는 지갑"></label><label>국가 코드<input id="country" maxlength="2" placeholder="KR"></label><label><input id="verified" type="checkbox" checked> 이메일 인증 완료</label><label><input id="marketing" type="checkbox" checked> 마케팅 동의</label><button>조회</button></form><p class="warning">이메일·IP는 개인정보입니다. 동의 목적과 정한 보존기간 안에서만 사용하세요.</p><div class="table-wrap"><table><thead><tr><th>신청</th><th>이메일</th><th>국가/IP</th><th>지갑</th><th>상태</th><th>마케팅</th><th>태그</th></tr></thead><tbody id="audience"></tbody></table></div></section><section class="card"><h2>대상 설문 만들기</h2><form id="poll" class="grid"><label>질문<input id="question" required></label><label>선택지(줄바꿈)<textarea id="options" rows="5" required></textarea></label><label>대상 국가<input id="poll-country" maxlength="2" placeholder="전체"></label><label>대상 태그<input id="poll-tag" placeholder="예: wallet-user"></label><label>종료일<input id="closes" type="datetime-local"></label><button>초안 만들기</button></form><div id="polls"></div></section></main><script src="/admin-nav.js?v=10018"></script><script type="module" src="/trial-audience-admin.js?v=10018"></script></body></html>
