<body><main class="claim"><section class="card"><span>IEUM FIRST EXPERIENCE</span><h1 id="name">캠페인 확인 중…</h1><nav class="language-switch" aria-label="Language"><button type="button" data-lang="ko">한국어</button><button type="button" data-lang="en">English</button></nav><img id="campaign-card" class="campaign-card-preview" alt="QR이 포함된 IEUM 체험 명함"><div id="summary"></div>
<section class="wallet-onboarding"><h2 id="wallet-question">IEUM 지갑이 있으신가요?</h2><div class="journey-actions"><button id="has-wallet" type="button">지갑이 있어요</button><button id="needs-wallet" class="secondary" type="button" aria-expanded="false">지갑이 없어요</button></div><div id="install-guide" hidden><h3 id="install-title">PC용 IEUM Wallet을 먼저 설치하세요</h3><p id="install-copy"></p><div class="actions"><a id="light-wallet" href="https://github.com/c4ei/ieum-wallet/releases/tag/wallet-light-latest" target="_blank" rel="noopener noreferrer">공식 Light Wallet 다운로드</a><a id="normal-wallet" href="https://github.com/c4ei/ieum-wallet/releases/tag/wallet-normal-latest" target="_blank" rel="noopener noreferrer">Normal Wallet 보기</a></div><ol id="install-steps"></ol><p id="mobile-note" class="warning"></p></div></section>
<form id="claim" hidden><label id="address-label">받을 IEUM 지갑 주소<input id="address" placeholder="0x…" required></label><label id="email-label">확인받을 이메일 주소<input id="email" type="email" autocomplete="email" maxlength="254" required></label><section id="captcha-panel" class="captcha-panel" aria-live="polite"><strong id="captcha-title">사람 확인</strong><p id="captcha-status">보안 확인을 불러오는 중입니다…</p><div id="captcha-box"></div><button id="captcha-retry" type="button" hidden>다시 불러오기</button></section><label id="confirm-label" class="confirm-row"><input id="confirm" type="checkbox" required><span id="confirm-text">이 지갑은 내가 관리하며 캠페인당 한 번만 받을 수 있음을 확인합니다.</span></label><label class="confirm-row"><input id="privacy-consent" type="checkbox" required><span id="privacy-text">체험 지급과 중복 방지를 위한 이메일·IP·국가·지갑 주소 수집 및 이용에 동의합니다.</span></label><label class="confirm-row"><input id="marketing-consent" type="checkbox"><span id="marketing-text">선택: IEUM 소식, 설문과 이벤트 안내를 이메일로 받는 데 동의합니다.</span></label><button id="claim-button" disabled>IEUM 체험하기</button></form><div id="result"></div><p id="security-note" class="warning"></p></section></main><script type="module" src="/trial.js?v=10018"></script></body></html>
