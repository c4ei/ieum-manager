<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IEUM 상품권 받기</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/voucher.css"></head><body><main class="voucher-shell"><section class="voucher-hero"><span>IEUM DIGITAL GIFT</span><h1 id="amount">상품권 확인 중…</h1><p>이 상품권은 먼저 정상 등록한 한 사람에게 한 번만 지급됩니다.</p></section><section class="voucher-card"><div id="guide"><h2>받는 방법</h2><ol><li>IEUM Wallet에서 내 지갑 주소를 복사합니다.</li><li>아래에 주소와 상품권 뒷면의 교환번호를 입력합니다.</li><li>내용을 확인하고 <b>내 지갑으로 받기</b>를 누릅니다.</li></ol></div><form id="claim"><label>받을 IEUM 지갑 주소<input id="address" autocomplete="off" placeholder="0x…" required></label><label>상품권 교환번호<input id="code" autocomplete="one-time-code" placeholder="XXXX-XXXX-XXXX-XXXX" required maxlength="19"></label><label class="confirm"><input id="confirm" type="checkbox" required> 입력한 주소가 내 주소이며, 잘못 입력하면 복구할 수 없음을 확인했습니다.</label><button>내 지갑으로 받기</button></form><div id="result" role="status"></div><p class="warning">교환번호를 다른 사람에게 보여주지 마세요. 운영자는 비밀번호나 개인키를 요구하지 않습니다.</p></section></main><script type="module" src="/voucher.js"></script></body></html>
