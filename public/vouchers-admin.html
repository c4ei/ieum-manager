<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IEUM 상품권 관리</title><link rel="stylesheet" href="/admin.css?v=10009"><link rel="stylesheet" href="/voucher.css?v=10009"><link rel="stylesheet" href="/vouchers-admin.css?v=10009"><link rel="stylesheet" href="/voucher-secret.css?v=10009"></head><body><main class="voucher-shell voucher-admin"><header class="voucher-admin-head"><div><a href="/">← Explorer</a><h1>IEUM 상품권 관리</h1><p>준비금·발행·지급 상태를 한 화면에서 확인합니다.</p></div><a class="admin-home" href="/admin/dashboard">전체 관리자</a></header><section class="emergency-login"><label for="admin-token">비상 관리자 토큰 <small>AAH 관리자 로그인 사용 시 불필요</small></label><div><input id="admin-token" type="password" autocomplete="current-password"><button id="connect" type="button">인증</button></div></section><section class="voucher-card"><div id="summary" class="summary-grid">불러오는 중…</div><form id="issue" class="issue-grid"><label>한 장당 IEUM<input id="amount" value="2" inputmode="decimal" required></label><label>발행 수량<input id="quantity" type="number" min="1" max="100" value="1" required></label><label>만료일(선택)<input id="expires" type="datetime-local"></label><button>상품권 발행</button></form><div id="new-items"></div></section><section class="voucher-card ledger"><div class="ledger-head"><div><h2>상품권 발행·지급 현황</h2><p id="result-count"></p></div><button id="refresh" type="button">새로고침</button></div><div class="filters"><label>상태<select id="status-filter"><option value="">전체</option><option value="issued">미사용</option><option value="claiming">지급 처리 중</option><option value="claimed">지급 완료</option><option value="failed">지급 실패</option><option value="cancelled">폐기</option><option value="expired">만료</option></select></label><label>상품권 번호 검색<input id="search" placeholder="예: 6LKKQTL8ER"></label></div><div id="items"></div><nav id="pages" class="voucher-pages" aria-label="상품권 목록 페이지"></nav><p class="privacy-note">새 상품권의 교환번호와 수령 토큰은 별도 키로 암호화 보관됩니다. 보기·재출력할 때마다 감사 기록이 남으며, 과거 상품권은 원문을 복원할 수 없습니다.</p></section></main><script type="module" src="/vouchers-admin.js?v=10009"></script></body></html>
