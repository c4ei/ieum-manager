<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IEUM 상품권 관리</title><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/voucher.css"></head><body><main class="voucher-shell"><h1>IEUM 상품권 관리</h1><p>체인 총발행량과 별개인 상품권 준비금·발행·사용 현황입니다.</p><label>비상 관리자 토큰(AAH 관리자 로그인 사용 시 불필요)<input id="admin-token" type="password"><button id="connect" type="button">인증</button></label><section class="voucher-card"><div id="summary">불러오는 중…</div><form id="issue"><label>한 장당 IEUM<input id="amount" value="2" required></label><label>발행 수량<input id="quantity" type="number" min="1" max="100" value="1" required></label><label>만료일(선택)<input id="expires" type="datetime-local"></label><button>상품권 발행</button></form><div id="new-items"></div></section><section class="voucher-card"><h2>최근 상품권</h2><div id="items"></div></section></main><script type="module" src="/vouchers-admin.js"></script></body></html>
